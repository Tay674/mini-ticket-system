services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: issuemanager
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d issuemanager"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data: